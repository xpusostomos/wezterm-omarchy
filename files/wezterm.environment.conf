# managed by wezterm-omarchy
#
# Point WezTerm at the system-wide config, so every user on this machine is
# themed without anything being installed into their home directory.
#
# This is read by the systemd user session, which is how a WezTerm started from a
# Hyprland keybind (omarchy-launch-terminal -> uwsm-app) actually receives it.
# /etc/profile.d would only reach login shells, not that path.
#
# IMPORTANT: keep this file and /etc/wezterm/wezterm.lua together. If this
# variable is set but the file is missing, WezTerm errors and loads no config at
# all -- it does not fall back. `make uninstall-global` removes both.
WEZTERM_CONFIG_FILE=/etc/wezterm/wezterm.lua
